[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "quarry"
version = "0.1.0"
description = "Local BM25 search over your notes, with answers that cite their sources."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Luskavex" }]
requires-python = ">=3.10"
dependencies = []
keywords = ["search", "bm25", "rag", "notes", "cli", "llm"]
classifiers = [
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Indexing",
]

[project.optional-dependencies]
claude = ["anthropic>=2.8"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
quarry = "quarry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["SIM905"]  # the stop-word list reads better as a block of text
